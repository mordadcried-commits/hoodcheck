services:
  - type: web
    name: hoodcheck
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /saglik
    envVars:
      - key: HOODCHECK_HOST
        value: 0.0.0.0
      - key: HOODCHECK_PORT
        value: "8080"
      - key: TRUST_PROXY
        value: "1"
      - key: SITE_URL
        value: https://hoodcheck.onrender.com   # kendi adresinle degistir
      # HOODCHECK_RPC buraya YAZILMAZ - Render panelinde
      # Environment > Add Secret File degil, Environment Variable olarak eklenir.
