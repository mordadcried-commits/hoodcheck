services:
  - type: web
    name: hoodcheck
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /saglik
    envVars:
      - key: HOODCHECK_HOST
        value: 0.0.0.0
      - key: HOODCHECK_PORT
        value: "8080"
      - key: TRUST_PROXY
        value: "1"
      - key: SITE_URL
        value: https://hoodcheck.onrender.com
      # HOODCHECK_RPC buraya YAZILMAZ (anahtar icerir) - Render panelinden
      # Environment > Add Environment Variable ile eklenir.
      #
      # DIKKAT: bu dosya yalnizca BLUEPRINT ile kurulumda okunur. "New Web Service"
      # yontemiyle kurulduysa degiskenleri panele ELLE eklemek gerekir.
